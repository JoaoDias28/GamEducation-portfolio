<text x="64" y="176" fill="#f6f9f6" font-size="72" font-weight="700" letter-spacing="-3">GamEducation</text>
<text x="66" y="229" fill="#b9d0dc" font-size="27">Bring educational content into games.</text>
<text x="66" y="286" fill="#b9d0dc" font-size="19">A PHP/MySQL platform and reusable Android library,</text>
<text x="66" y="315" fill="#b9d0dc" font-size="19">with Snake demonstrating educational activities inside a game.</text>
