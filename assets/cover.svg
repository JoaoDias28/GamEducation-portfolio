<title id="title">GamEducation — Educational content inside Android games</title>
<desc id="desc">Final-year Computer Engineering project at IPCB, 2023–2024. A PHP/MySQL web platform and reusable Android integration library, with Snake as an example host game. Co-developed by João Dias and Luís Mateus.</desc>
